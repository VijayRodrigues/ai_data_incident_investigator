[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-incident-investigator"
version = "0.1.0"
description = "AI-powered data incident investigation and root-cause analysis platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",

    # Data / SQL
    "pandas>=2.2,<3.0",
    "grpcio",
    "pyarrow",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pgvector",

    # Data engineering
    "pyspark",
    "grpcio",
    "grpcio-status",
    "googleapis-common-protos",
    "databricks-sdk",

    # AI / agent
    "langgraph",
    "langchain-core",
    "ollama",

    # RAG
    "httpx",

    # Azure
    "boto3",
    "azure-identity",
    "azure-keyvault-secrets",
    "azure-storage-file-datalake",

    # Configuration / utilities
    "python-dotenv",
    "tenacity",

    # Observability
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",

    # UI
    "streamlit",

    # Data quality
    "great-expectations"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = true
warn_unused_ignores = true